name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core tests (crypto, formats, paths)
        run: cargo test --locked -p privavault-core
      - name: App tests (settings, platform paths)
        run: cargo test --locked -p privavault
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI tests (i18n, CSP, XSS regression)
        run: node --test tests/ui

      - name: RustSec advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit

  release:
    name: Bundle (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc for the AppImage/deb
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build bundles
        working-directory: src-tauri
        run: cargo tauri build --bundles ${{ matrix.bundles }}

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir out
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage out/
      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item target/release/privavault.exe "out/PrivaVault-Portable-$v.exe"
      - name: Checksums
        shell: bash
        run: cd out && sha256sum * > SHA256SUMS-${{ runner.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: privavault-${{ runner.os }}
          path: out/*

      - name: Publish to release (tags only, never deletes)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --draft --title "${GITHUB_REF_NAME}" --notes-file docs/CHANGELOG.md
          gh release upload "${GITHUB_REF_NAME}" out/* --clobber
