name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Core tests (crypto, formats, paths)
        run: cargo test --locked -p privavault-core
      - name: App tests (settings, platform paths)
        run: cargo test --locked -p privavault
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI tests (i18n, CSP, XSS regression)
        run: node --test tests/ui/ui.test.js

      - name: RustSec advisories
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-audit --locked
          cargo audit

  release:
    name: Bundle (${{ matrix.os }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04 # oldest supported glibc for the AppImage/deb
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri CLI
        # Pinned: the NSIS toolchain below matches what this CLI's bundler expects.
        run: cargo install tauri-cli --version "=2.12.4" --locked
      # The bundler downloads NSIS from github.com/tauri-apps/binary-releases, which kept answering
      # HTTP 504 to GitHub's Windows runners (v2.2.0). Fetch it ourselves with retries, verify the
      # same SHA-1 hashes the bundler checks, and cache it so later releases don't download it.
      - name: Cache NSIS toolchain (Windows)
        id: nsis-cache
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\tauri\NSIS
          key: tauri-nsis-3.13-utils-0.5.3
      - name: Fetch NSIS toolchain with retries (Windows)
        if: runner.os == 'Windows' && steps.nsis-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          function Get-Verified($url, $out, $sha1) {
            foreach ($i in 1..8) {
              try {
                Invoke-WebRequest $url -OutFile $out -MaximumRetryCount 5 -RetryIntervalSec 15
                if ((Get-FileHash $out -Algorithm SHA1).Hash -eq $sha1) { return }
                throw "SHA-1 mismatch for $url"
              } catch { Write-Host "attempt $i failed: $_"; Start-Sleep 60 }
            }
            throw "could not download $url"
          }
          $tools = Join-Path $env:LOCALAPPDATA "tauri"
          New-Item -ItemType Directory -Force $tools | Out-Null
          Get-Verified "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip" "$env:RUNNER_TEMP\nsis.zip" "DB14F8AF2EA346B786C6AE19343F61AAF5E09B8E"
          Expand-Archive "$env:RUNNER_TEMP\nsis.zip" -DestinationPath $tools -Force
          Move-Item (Join-Path $tools "nsis-3.13") (Join-Path $tools "NSIS")
          $plugins = Join-Path $tools "NSIS\Plugins\x86-unicode\additional"
          New-Item -ItemType Directory -Force $plugins | Out-Null
          Get-Verified "https://github.com/tauri-apps/nsis-tauri-utils/releases/download/nsis_tauri_utils-v0.5.3/nsis_tauri_utils.dll" (Join-Path $plugins "nsis_tauri_utils.dll") "75197FEE3C6A814FE035788D1C34EAD39349B860"
      - name: Build bundles
        working-directory: src-tauri
        shell: bash
        run: |
          # Bundling downloads helper tools from GitHub; retry on transient HTTP errors
          # (compiled code is reused, so a retry only repeats the bundling step).
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "::warning::attempt $i failed, retrying in 60 s"; sleep 60; done; return 1; }
          if [ "$RUNNER_OS" = Linux ]; then
            retry cargo tauri build --bundles deb,rpm
            # The AppImage is built from the deb tree but needs a visible desktop entry with
            # Categories (appimagetool rejects the hidden one deb/rpm use next to
            # com.privavault.app.desktop), so it gets its own config overlay.
            retry cargo tauri build --bundles appimage --config ../packaging/linux/appimage.tauri.json
          else
            retry cargo tauri build --bundles ${{ matrix.bundles }}
          fi

      - name: Collect artifacts (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir out
          cp target/release/bundle/deb/*.deb target/release/bundle/rpm/*.rpm target/release/bundle/appimage/*.AppImage out/
      - name: Collect artifacts (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe out/
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          Copy-Item target/release/privavault.exe "out/PrivaVault-Portable-$v.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: privavault-${{ runner.os }}
          path: out/*

  arch:
    name: Bundle (Arch Linux package)
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Build dependencies
        run: pacman -Syu --noconfirm --needed git rust webkit2gtk-4.1 gtk3 librsvg
      - uses: actions/checkout@v4
      - name: Build with makepkg (as an unprivileged user, as makepkg requires)
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            sed -i "s/^pkgver=.*/pkgver=${GITHUB_REF_NAME#v}/" packaging/arch/PKGBUILD
          fi
          useradd -m builder
          mkdir -p out
          chown -R builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder env PRIVAVAULT_LOCAL_SRC=../.. PKGDEST="$GITHUB_WORKSPACE/out" makepkg -f --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: privavault-arch
          path: out/*.pkg.tar.zst

  publish:
    name: Sign and publish release
    needs: [release, arch]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sign packages for the in-app updater
        env:
          # The private key exists only here (repository secrets), never in the bundle jobs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || { echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is not set"; exit 1; }
          V="${GITHUB_REF_NAME#v}"
          rm -f dist/*-debug-*
          cd dist
          for f in *_x64-setup.exe *_amd64.AppImage *_amd64.deb *.x86_64.rpm *-x86_64.pkg.tar.zst; do
            npx --yes @tauri-apps/cli@2 signer sign --app-version "$V" "$f"
          done
      - name: Update manifest (latest.json)
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk -v v="## $V " 'index($0, v) == 1 {f=1; next} /^## /{f=0} f' docs/CHANGELOG.md > notes.md
          python3 tools/release/make_manifest.py "$V" dist notes.md "$GITHUB_REPOSITORY" > dist/latest.json
          python3 -c "import json; m=json.load(open('dist/latest.json')); print(m['version'], sorted(m['platforms']))"
      - name: Publish (installable files + latest.json only; signatures live inside latest.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          rm -f *.sig *.txt
          ls -la
          gh release create "${GITHUB_REF_NAME}" --title "PrivaVault ${GITHUB_REF_NAME}" --notes-file ../notes.md --latest -- *
          # v2.2.1: `gh` exited 0 but latest.json never reached the release (GitHub outage), which
          # silently breaks in-app updates. Check every file and re-upload what is missing.
          for attempt in 1 2 3 4 5; do
            missing=$(comm -23 <(ls | sort) <(gh release view "${GITHUB_REF_NAME}" --json assets --jq '.assets[] | select(.state == "uploaded") | .name' | sort))
            [ -z "$missing" ] && { echo "all $(ls | wc -l) files on the release"; exit 0; }
            echo "::warning::missing on the release: $missing (attempt $attempt)"
            gh release upload "${GITHUB_REF_NAME}" --clobber $missing || true
            sleep 30
          done
          echo "::error::files still missing from the release: $missing"; exit 1
