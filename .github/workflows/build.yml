name: Build and Release PrivaVault

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release-windows:
    name: Build & Release Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Electron App (Windows)
        run: npm run build:win

      - name: Create & Upload Release via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "${{ github.ref_name }}" --yes || true
          gh release create "${{ github.ref_name }}" dist/PrivaVault-Setup-*.exe dist/PrivaVault-Portable-*.exe --title "${{ github.ref_name }}" --generate-notes --draft=false