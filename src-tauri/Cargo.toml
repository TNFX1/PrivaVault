[package]
name = "privavault"
description = "Privacy-focused, offline file encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "privavault"

[lib]
name = "privavault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
privavault-core = { path = "../crates/privavault-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
zeroize = "1.9.1"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
tempfile = "3.27.0"
