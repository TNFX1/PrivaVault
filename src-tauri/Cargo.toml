[package]
name = "privavault"
description = "Privacy-focused, offline file encryption"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "privavault"

[lib]
name = "privavault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
getrandom = "0.3"
privavault-core = { path = "../crates/privavault-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
zeroize = "1.9.1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
tempfile = "3.27.0"

# Already in the tree via tauri-plugin-notification; used directly to read the desktop's
# light/dark preference from the XDG portal (see platform::appearance).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"

# Already in the tree; turns terminal echo off for the command-line password prompt (cli.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
