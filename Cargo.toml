[workspace]
resolver = "2"
members = ["crates/privavault-core", "src-tauri"]

[workspace.package]
version = "2.2.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/TNFX1/PrivaVault"
rust-version = "1.90"

# Crypto is unbearably slow unoptimised; keep tests realistic.
[profile.dev.package."*"]
opt-level = 3
[profile.test]
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
# The core does the crypto; keep debug builds of the app usable (GUI tests encrypt ~1.5 GB).
[profile.dev.package.privavault-core]
opt-level = 2
