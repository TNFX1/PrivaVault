<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PrivaVault - Secure Local Encryption</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #121316;
            --surface: #1c1d22;
            --surface-hover: #26272f;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #2e3038;
            --input-bg: #141518;
            --success-bg: #064e3b;
            --success-text: #6ee7b7;
            --success-border: #047857;
            --error-bg: #7f1d1d;
            --error-text: #fca5a5;
            --error-border: #b91c1c;
            --info-bg: #1e3a8a;
            --info-text: #93c5fd;
            --info-border: #1d4ed8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        /* --- ÖZEL SCROLLBAR STİLLERİ --- */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        /* ------------------------------- */

        body {
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background-color: var(--surface);
            width: 100%;
            max-width: 480px;
            padding: 32px 28px;
            border-radius: 20px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
            border: 1px solid var(--border);
            position: relative;
        }

        .top-tools {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .tool-btn, .lang-switch {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--input-bg);
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--border);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tool-btn:hover, .lang-switch:hover {
            border-color: var(--primary);
            color: var(--text-main);
        }

        .tool-btn svg, .lang-switch svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        .lang-switch select, select.app-select {
            background: transparent;
            border: none;
            font-size: 12px;
            font-weight: 600;
            color: inherit;
            cursor: pointer;
            outline: none;
        }

        .header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 24px;
        }

        .header img.app-logo {
            width: 96px;
            height: 96px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            background-color: var(--input-bg);
            padding: 4px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            background: transparent;
            color: var(--text-muted);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tab-btn.active {
            background-color: var(--surface);
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 6px;
            color: var(--text-muted);
        }

        .file-input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background-color: var(--input-bg);
            border: 1px dashed var(--border);
            border-radius: 10px;
            padding: 10px 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .file-input-wrapper:hover {
            border-color: var(--primary);
            background-color: var(--surface-hover);
        }

        .browse-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .file-name-text {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            user-select: none;
        }

        input[type="password"], input[type="text"], select.full-select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 13px;
            background-color: var(--input-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
        }

        select.full-select option {
            background-color: var(--surface);
            color: var(--text-main);
        }

        input:focus, select.full-select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        .btn {
            width: 100%;
            padding: 13px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #334155;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .file-list {
            margin-top: 14px;
            max-height: 160px;
            overflow-y: auto;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 6px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .download-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
        }

        .download-btn:hover {
            background: #047857;
        }

        .action-row {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-row .btn {
            flex: 1;
            font-size: 12px;
            margin-top: 0;
            padding: 10px;
        }

        .progress-wrapper {
            margin-top: 16px;
            display: none;
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--input-bg);
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2563eb, #60a5fa);
            border-radius: 6px;
            transition: width 0.2s ease;
        }

        #status {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            display: none;
            text-align: center;
        }

        .status-success { background-color: var(--success-bg); color: var(--success-text); border-color: var(--success-border); display: block !important; }
        .status-error { background-color: var(--error-bg); color: var(--error-text); border-color: var(--error-border); display: block !important; }
        .status-info { background-color: var(--info-bg); color: var(--info-text); border-color: var(--info-border); display: block !important; }

        .modal-backdrop {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal {
            background: var(--surface);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border);
            width: 90%;
            max-width: 400px;
        }

        .modal h2 { font-size: 18px; margin-bottom: 16px; }
        .modal-footer { margin-top: 20px; display: flex; justify-content: flex-end; gap: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <div class="top-tools">
            <button class="tool-btn" onclick="openSettings()" id="btnSettingsTool" title="Settings">
                <svg viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c-.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
            </button>

            <div class="lang-switch">
                <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
                <select id="langSelect" class="app-select" onchange="changeLanguage(this.value)">
                    <option value="en" selected>EN</option>
                    <option value="tr">TR</option>
                </select>
            </div>
        </div>

        <div class="header">
            <img src="logo.png" alt="Logo" class="app-logo" onerror="this.style.display='none'">
            <h1>PrivaVault</h1>
            <p id="subTitle">Secure Local Stream Encryption</p>
        </div>

        <div class="tabs">
            <button class="tab-btn active" id="tabEncBtn" onclick="switchTab('encrypt')">Encrypt</button>
            <button class="tab-btn" id="tabDecBtn" onclick="switchTab('decrypt')">Decrypt</button>
        </div>

        <div id="encryptTab" class="tab-content active">
            <div class="form-group">
                <label id="lblSelectFiles">Select File(s)</label>
                <div class="file-input-wrapper" onclick="handleSelectEncFile()">
                    <button type="button" class="browse-btn" id="btnBrowseEnc">Browse</button>
                    <span class="file-name-text" id="encFileNameText">No file selected...</span>
                </div>
            </div>

            <div class="form-group">
                <label id="lblEncPass">Password</label>
                <input type="password" id="encPassword" placeholder="Enter strong password">
            </div>

            <div class="form-group">
                <label id="lblConfirmPass">Confirm Password</label>
                <input type="password" id="encConfirmPassword" placeholder="Re-enter password">
            </div>

            <button class="btn" id="btnEncrypt" onclick="processEncrypt()">Encrypt File(s)</button>
        </div>

        <div id="decryptTab" class="tab-content">
            <div class="form-group">
                <label id="lblSelectVault">Select Encrypted Vault Package</label>
                <div class="file-input-wrapper" onclick="handleSelectVaultFile()">
                    <button type="button" class="browse-btn" id="btnBrowseDec">Browse</button>
                    <span class="file-name-text" id="decFileNameText">No file selected...</span>
                </div>
            </div>

            <div class="form-group">
                <label id="lblDecPass">Password</label>
                <input type="password" id="decPassword" placeholder="Enter password">
            </div>

            <button class="btn" id="btnInspect" onclick="inspectVault()">Open & Inspect Vault</button>

            <div id="vaultContent" style="display:none;">
                <div class="file-list" id="fileListContainer"></div>
                <div class="action-row">
                    <button class="btn" id="btnExtractFolder" style="background:#2563eb" onclick="extractAll('folder')">Extract to Folder</button>
                    <button class="btn" id="btnExtractZip" style="background:#7c3aed" onclick="extractAll('zip')">Download as ZIP</button>
                </div>
            </div>
        </div>

        <div class="progress-wrapper" id="progressWrapper">
            <div class="progress-header">
                <span id="progressStatusText">Processing...</span>
                <span id="progressPercentText">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
        </div>

        <div id="status"></div>
    </div>

    <div class="modal-backdrop" id="settingsModal">
        <div class="modal">
            <h2 id="settingsTitle">Settings</h2>

            <div class="form-group">
                <label id="lblSecurityLevel">Key Derivation Rounds (Security Level)</label>
                <select id="securityLevelSelect" class="full-select">
                    <option value="100000" id="optSec100k">100,000 Rounds (Standard)</option>
                    <option value="300000" id="optSec300k">300,000 Rounds (High Security)</option>
                    <option value="600000" id="optSec600k">600,000 Rounds (Ultra Security)</option>
                </select>
            </div>

            <div class="form-group">
                <label id="lblCustomExt">Default Encrypted File Extension</label>
                <select id="customExtSelect" class="full-select">
                    <option value="pvault" id="optExtPvault" selected>.pvault (PrivaVault Default)</option>
                    <option value="vault" id="optExtVault">.vault (Standard Vault)</option>
                    <option value="enc" id="optExtEnc">.enc (Encrypted File)</option>
                    <option value="bin" id="optExtBin">.bin (Binary File)</option>
                    <option value="dat" id="optExtDat">.dat (Data File)</option>
                    <option value="dat.enc" id="optExtDatEnc">.dat.enc (Secure Data)</option>
                </select>
            </div>

            <div class="modal-footer">
                <button class="browse-btn" id="btnSaveSettings" onclick="saveSettings()">Save</button>
            </div>
        </div>
    </div>

    <script>
        let selectedEncFiles = [];
        let selectedVaultPath = null;
        let currentLang = 'en';
        let customExtension = 'pvault';
        let securityIterations = '100000';

        const i18n = {
            en: {
                subTitle: "Secure Local Stream Encryption",
                tabEnc: "Encrypt",
                tabDec: "Decrypt",
                lblSelectFiles: "Select File(s)",
                lblSelectVault: "Select Encrypted Vault Package",
                lblPass: "Password",
                lblConfirmPass: "Confirm Password",
                phEncPass: "Enter strong password",
                phConfirmPass: "Re-enter password",
                phDecPass: "Enter password",
                btnBrowse: "Browse",
                btnEncrypt: "Package & Encrypt File(s)",
                btnInspect: "Open & Inspect Vault",
                btnExtractFolder: "Extract to Folder",
                btnExtractZip: "Download as ZIP",
                btnDownloadSingle: "Download",
                settingsTitle: "Settings",
                btnSaveSettings: "Save",
                lblSecurityLevel: "Security Encryption Level (PBKDF2)",
                lblCustomExt: "Default Encrypted Extension",
                optSec100k: "100,000 Rounds (Standard)",
                optSec300k: "300,000 Rounds (High Security)",
                optSec600k: "600,000 Rounds (Ultra Security)",
                optExtPvault: ".pvault (PrivaVault Default)",
                optExtVault: ".vault (Standard Vault)",
                optExtEnc: ".enc (Encrypted File)",
                optExtBin: ".bin (Binary File)",
                optExtDat: ".dat (Data File)",
                optExtDatEnc: ".dat.enc (Secure Data)",
                noFile: "No file selected...",
                filesSelected: "file(s) selected",
                msgEncSuccess: "Successfully packaged and encrypted!",
                msgEncProgress: "Packaging and encrypting...",
                msgInspectProgress: "Decrypting archive content...",
                msgExtracting: "Extracting...",
                msgExtractingAll: "Extracting all files...",
                msgDone: "Done",
                msgExtractedSingle: "extracted!",
                msgExtractAllSuccess: "All files extracted successfully!",
                msgError: "Error",
                errNoEncFile: "Please select file(s) to encrypt.",
                errNoVaultFile: "Please select an encrypted vault package.",
                errNoPass: "Please enter a password.",
                errPassMismatch: "Passwords do not match!"
            },
            tr: {
                subTitle: "Yerel ve Güvenli Akış Şifreleme",
                tabEnc: "Şifrele",
                tabDec: "Şifre Çöz",
                lblSelectFiles: "Dosya(lar) Seç",
                lblSelectVault: "Şifreli Paketi Seç (.pvault)",
                lblPass: "Şifre",

                phConfirmPass: "Şifreyi tekrar girin",
                phDecPass: "Şifrenizi girin",
                btnBrowse: "Gözat",

                btnInspect: "İçeriği Aç ve İncele",

                btnExtractZip: "ZIP Olarak İndir",
                btnDownloadSingle: "İndir",
                settingsTitle: "Ayarlar",
                btnSaveSettings: "Kaydet",
                lblSecurityLevel: "Güvenlik Şifreleme Seviyesi (PBKDF2)",
                lblCustomExt: "Varsayılan Şifreli Uzantı",
                optSec100k: "100.000 Tur (Standart)",
                optSec300k: "300.000 Tur (Yüksek Güvenlik)",
                optSec600k: "600.000 Tur (Ultra Güvenlik)",
                optExtPvault: ".pvault (PrivaVault Varsayılan)",
                optExtVault: ".vault (Standart Kasa)",
                optExtEnc: ".enc (Şifrelenmiş Dosya)",
                optExtBin: ".bin (İkili / Binary Dosya)",
                optExtDat: ".dat (Veri Dosyası)",
                optExtDatEnc: ".dat.enc (Güvenli Veri)",
                noFile: "Dosya seçilmedi...",
                filesSelected: "dosya seçildi",
                msgEncSuccess: "Başarıyla paketlendi ve şifrelendi!",
                msgEncProgress: "Paketleniyor ve şifreleniyor...",
                msgInspectProgress: "Arşiv içeriği çözülüyor...",
                msgExtracting: "Çıkarılıyor...",
                msgExtractingAll: "Tüm dosyalar çıkarılıyor...",
                msgDone: "Tamamlandı",
                msgExtractedSingle: "başarıyla çıkarıldı!",
                msgExtractAllSuccess: "Tüm dosyalar başarıyla çıkarıldı!",
                msgError: "Hata",
                errNoEncFile: "Lütfen şifrelenecek dosya(ları) seçin.",
                errNoVaultFile: "Lütfen şifreli vault paketini seçin.",
                errNoPass: "Lütfen şifrenizi girin.",
                errPassMismatch: "Girdiğiniz şifreler eşleşmiyor!"
            }
        };

        if (window.electronAPI && window.electronAPI.onProgress) {
            window.electronAPI.onProgress((data) => {
                showProgress(data.percent, data.status);
            });
        }

        function changeLanguage(lang) {
            currentLang = lang;
            const t = i18n[lang];

            document.getElementById('subTitle').textContent = t.subTitle;
            document.getElementById('tabEncBtn').textContent = t.tabEnc;
            document.getElementById('tabDecBtn').textContent = t.tabDec;
            document.getElementById('lblSelectFiles').textContent = t.lblSelectFiles;
            document.getElementById('lblSelectVault').textContent = t.lblSelectVault;
            document.getElementById('lblEncPass').textContent = t.lblPass;
            document.getElementById('lblConfirmPass').textContent = t.lblConfirmPass;
            document.getElementById('lblDecPass').textContent = t.lblPass;

            // Placeholders
            document.getElementById('encPassword').placeholder = t.phEncPass;
            document.getElementById('encConfirmPassword').placeholder = t.phConfirmPass;
            document.getElementById('decPassword').placeholder = t.phDecPass;

            // Buttons & Modal
            document.getElementById('btnBrowseEnc').textContent = t.btnBrowse;
            document.getElementById('btnBrowseDec').textContent = t.btnBrowse;
            document.getElementById('btnEncrypt').textContent = t.btnEncrypt;
            document.getElementById('btnInspect').textContent = t.btnInspect;
            document.getElementById('btnExtractFolder').textContent = t.btnExtractFolder;
            document.getElementById('btnExtractZip').textContent = t.btnExtractZip;
            document.getElementById('settingsTitle').textContent = t.settingsTitle;
            document.getElementById('btnSaveSettings').textContent = t.btnSaveSettings;
            document.getElementById('lblSecurityLevel').textContent = t.lblSecurityLevel;
            document.getElementById('lblCustomExt').textContent = t.lblCustomExt;
            document.getElementById('btnSettingsTool').title = t.settingsTitle;

            // Select Options
            document.getElementById('optSec100k').textContent = t.optSec100k;
            document.getElementById('optSec300k').textContent = t.optSec300k;
            document.getElementById('optSec600k').textContent = t.optSec600k;
            document.getElementById('optExtPvault').textContent = t.optExtPvault;
            document.getElementById('optExtVault').textContent = t.optExtVault;
            document.getElementById('optExtEnc').textContent = t.optExtEnc;
            document.getElementById('optExtBin').textContent = t.optExtBin;
            document.getElementById('optExtDat').textContent = t.optExtDat;
            document.getElementById('optExtDatEnc').textContent = t.optExtDatEnc;

            if (selectedEncFiles.length === 0) document.getElementById('encFileNameText').textContent = t.noFile;
            if (!selectedVaultPath) document.getElementById('decFileNameText').textContent = t.noFile;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            hideStatus();
            hideProgress();

            if (tab === 'encrypt') {
                document.getElementById('tabEncBtn').classList.add('active');
                document.getElementById('encryptTab').classList.add('active');
            } else {
                document.getElementById('tabDecBtn').classList.add('active');
                document.getElementById('decryptTab').classList.add('active');
            }
        }

        async function handleSelectEncFile() {
            const files = await window.electronAPI.selectFiles();
            if (files && files.length > 0) {
                selectedEncFiles = files;
                const t = i18n[currentLang];
                if (files.length === 1) {
                    document.getElementById('encFileNameText').textContent = `${files[0].name} (${formatBytes(files[0].size)})`;
                } else {
                    document.getElementById('encFileNameText').textContent = `${files.length} ${t.filesSelected}`;
                }
            }
        }

        async function handleSelectVaultFile() {
            const file = await window.electronAPI.selectVaultFile();
            if (file) {
                selectedVaultPath = file.path;
                document.getElementById('decFileNameText').textContent = `${file.name} (${formatBytes(file.size)})`;
                document.getElementById('vaultContent').style.display = 'none';
            }
        }

        async function processEncrypt() {
            const password = document.getElementById('encPassword').value;
            const confirmPassword = document.getElementById('encConfirmPassword').value;
            const t = i18n[currentLang];

            if (selectedEncFiles.length === 0) return showStatus(t.errNoEncFile, 'error');
            if (!password) return showStatus(t.errNoPass, 'error');
            if (password !== confirmPassword) return showStatus(t.errPassMismatch, 'error');

            hideStatus();
            showProgress(5, t.msgEncProgress);
            setControlsDisabled(true);

            const filePaths = selectedEncFiles.map(f => f.path);
            
            setTimeout(async () => {
                const res = await window.electronAPI.encryptFile({
                    filePaths: filePaths,
                    password: password,
                    customExt: customExtension,
                    iterations: securityIterations
                });

                setControlsDisabled(false);

                if (res.success) {
                    showProgress(100, t.msgEncSuccess);
                    showStatus(`${res.count} ${t.msgEncSuccess}`, 'success');
                    document.getElementById('encPassword').value = '';
                    document.getElementById('encConfirmPassword').value = '';
                } else if (res.status !== 'canceled') {
                    hideProgress();
                    showStatus(`${t.msgError}: ${res.error}`, 'error');
                } else {
                    hideProgress();
                }
            }, 50);
        }

        async function inspectVault() {
            const password = document.getElementById('decPassword').value;
            const t = i18n[currentLang];

            if (!selectedVaultPath) return showStatus(t.errNoVaultFile, 'error');
            if (!password) return showStatus(t.errNoPass, 'error');

            hideStatus();
            showProgress(10, t.msgInspectProgress);
            setControlsDisabled(true);

            setTimeout(async () => {
                const res = await window.electronAPI.inspectVault({
                    filePath: selectedVaultPath,
                    password: password
                });

                setControlsDisabled(false);

                if (res.success) {
                    hideProgress();
                    hideStatus();
                    const container = document.getElementById('fileListContainer');
                    container.innerHTML = '';

                    res.files.forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'file-item';
                        item.innerHTML = `
                            <span>${f.name} (${formatBytes(f.size)})</span>
                            <button class="download-btn" onclick="extractSingle('${f.name}')">${t.btnDownloadSingle}</button>
                        `;
                        container.appendChild(item);
                    });

                    document.getElementById('vaultContent').style.display = 'block';
                } else {
                    hideProgress();
                    showStatus(res.error, 'error');
                }
            }, 50);
        }

        async function extractSingle(fileName) {
            const password = document.getElementById('decPassword').value;
            const t = i18n[currentLang];
            showProgress(20, t.msgExtracting);
            setControlsDisabled(true);

            const res = await window.electronAPI.extractSingleFile({
                filePath: selectedVaultPath,
                password: password,
                fileName: fileName
            });

            setControlsDisabled(false);

            if (res.success) {
                showProgress(100, t.msgDone);
                showStatus(`${fileName} ${t.msgExtractedSingle}`, 'success');
            } else if (res.status !== 'canceled') {
                hideProgress();
                showStatus(`${t.msgError}: ${res.error}`, 'error');
            } else {
                hideProgress();
            }
        }

        async function extractAll(mode) {
            const password = document.getElementById('decPassword').value;
            const t = i18n[currentLang];
            showProgress(15, t.msgExtractingAll);
            setControlsDisabled(true);

            const res = await window.electronAPI.extractAllFiles({
                filePath: selectedVaultPath,
                password: password,
                mode: mode
            });

            setControlsDisabled(false);

            if (res.success) {
                showProgress(100, t.msgDone);
                showStatus(t.msgExtractAllSuccess, 'success');
            } else if (res.status !== 'canceled') {
                hideProgress();
                showStatus(`${t.msgError}: ${res.error}`, 'error');
            } else {
                hideProgress();
            }
        }

        function showProgress(percent, text) {
            const wrapper = document.getElementById('progressWrapper');
            const fill = document.getElementById('progressBarFill');
            const status = document.getElementById('progressStatusText');
            const pct = document.getElementById('progressPercentText');

            wrapper.style.display = 'block';
            fill.style.width = Math.min(100, Math.max(0, percent)) + '%';
            if (text) status.textContent = text;
            pct.textContent = Math.round(percent) + '%';
        }

        function hideProgress() {
            document.getElementById('progressWrapper').style.display = 'none';
            document.getElementById('progressBarFill').style.width = '0%';
        }

        function setControlsDisabled(disabled) {
            document.querySelectorAll('button, input').forEach(el => {
                if (el.id !== 'langSelect') el.disabled = disabled;
            });
        }

        function openSettings() {
            document.getElementById('customExtSelect').value = customExtension;
            document.getElementById('securityLevelSelect').value = securityIterations;
            document.getElementById('settingsModal').style.display = 'flex';
        }

        function saveSettings() {
            customExtension = document.getElementById('customExtSelect').value;
            securityIterations = document.getElementById('securityLevelSelect').value;
            document.getElementById('settingsModal').style.display = 'none';
        }

        function showStatus(text, type) {
            const s = document.getElementById('status');
            s.className = `status-${type}`;
            s.textContent = text;
        }

        function hideStatus() {
            const s = document.getElementById('status');
            s.className = '';
            s.style.display = 'none';
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        changeLanguage('en');
    </script>
</body>
</html>
